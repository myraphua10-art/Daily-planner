<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Myra's Planner</title>

<!-- iOS Add-to-Home-Screen support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="theme-color" content="#6366f1">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='white' font-family='-apple-system'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<link rel="manifest" id="manifestLink">

<style>
  :root{
    --bg:#f5f6fb; --card:#ffffff; --ink:#1c1e2b; --sub:#6b7280; --line:#e8e9f1;
    --math:#3b82f6; --hist:#f59e0b; --phy:#8b5cf6; --chem:#10b981;
    --free:#06b6d4; --own:#ef4444; --accent:#6366f1; --shadow: 0 4px 18px rgba(30,30,60,0.08);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; -webkit-text-size-adjust:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#eef1fb 0%, #f7f4fb 100%); color:var(--ink); min-height:100vh;
    overscroll-behavior-y:none;
  }
  .app{display:flex; min-height:100vh;}

  /* ===== Desktop sidebar (hidden on mobile) ===== */
  nav.sidebar{
    width:220px; background:var(--card); border-right:1px solid var(--line); padding:24px 14px;
    position:sticky; top:0; height:100vh; flex-shrink:0;
  }
  nav.sidebar h1{font-size:17px; margin:0 0 4px; line-height:1.3;}
  nav.sidebar .tagline{font-size:12px; color:var(--sub); margin-bottom:24px;}
  nav.sidebar button{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:none;
    padding:11px 12px; border-radius:10px; font-size:14px; color:var(--ink); cursor:pointer; margin-bottom:4px;
    transition:.15s;
  }
  nav.sidebar button:hover{background:#f0f1fa;}
  nav.sidebar button.active{background:var(--accent); color:white; font-weight:600;}

  main{flex:1; padding:32px 40px 40px; max-width:1080px; width:100%;}

  /* ===== Mobile bottom tab bar ===== */
  nav.tabbar{
    display:none; position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:6px 4px calc(6px + var(--safe-bottom));
    justify-content:space-around;
  }
  nav.tabbar button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none;
    padding:7px 2px; min-height:52px; color:var(--sub); font-size:10.5px; font-weight:600; border-radius:12px;
    cursor:pointer; -webkit-user-select:none; user-select:none;
  }
  nav.tabbar button .ic{font-size:21px; line-height:1;}
  nav.tabbar button.active{color:var(--accent);}
  nav.tabbar button:active{background:#f0f1fa;}

  .install-banner{
    display:none; background:linear-gradient(135deg,#fff,#f3f1ff); border:1px solid #e0d9ff; border-radius:14px;
    padding:12px 14px; margin-bottom:16px; font-size:12.5px; color:#4338ca; align-items:center; gap:10px;
  }
  .install-banner b{display:block; font-size:13px; margin-bottom:2px;}

  .countdown-bar{
    background:linear-gradient(135deg,var(--accent),#8b8ff0); color:white; border-radius:18px;
    padding:18px 22px; margin-bottom:22px; box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
  }
  .countdown-bar .big{font-size:24px; font-weight:700;}
  .countdown-bar .lbl{font-size:11.5px; opacity:.85; text-transform:uppercase; letter-spacing:.04em;}
  h2.section-title{font-size:20px; margin:0 0 16px;}
  .card{background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px;}
  .exam-card{display:flex; gap:14px; align-items:flex-start;}
  .exam-dot{width:10px; height:10px; border-radius:50%; margin-top:6px; flex-shrink:0;}
  .exam-card h3{margin:0 0 4px; font-size:15.5px;}
  .exam-meta{font-size:12.5px; color:var(--sub); margin-bottom:8px;}
  .chip{display:inline-block; background:#eef0fb; color:#444; font-size:11.5px; padding:4px 10px; border-radius:20px; margin:2px 4px 0 0;}
  .badge{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; margin-left:0; display:inline-block; margin-top:4px;}
  .badge.confirmed{background:#d1fae5; color:#047857;}
  .badge.estimated{background:#fef3c7; color:#92400e;}
  .weight{font-weight:700;}
  .exam-days{font-size:13px; font-weight:700; padding:6px 13px; border-radius:20px; white-space:nowrap; align-self:center;}
  .week-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:10px;}
  .day-col{background:#fafbff; border-radius:12px; padding:10px; min-height:140px;}
  .day-col h4{font-size:12px; margin:0 0 8px; text-align:center; color:var(--sub); text-transform:uppercase; letter-spacing:.03em;}
  .slot{font-size:11px; padding:7px 8px; border-radius:8px; margin-bottom:6px; line-height:1.35;}
  .slot.free{background:#cffafe; border-left:3px solid var(--free); color:#0e7490;}
  .slot.studyblock{background:#ede9fe; border-left:3px solid var(--phy); color:#5b21b6;}
  .slot.own{background:#fee2e2; border-left:3px solid var(--own); color:#991b1b; text-align:center; font-weight:700;}
  .date-picker-row{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .date-nav{display:flex; align-items:center; gap:8px; background:white; border-radius:14px; padding:6px; box-shadow:var(--shadow);}
  .date-nav button{
    width:38px; height:38px; border-radius:10px; border:none; background:#f0f1fa; color:var(--ink); font-size:18px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .date-nav button:active{background:var(--accent); color:white;}
  .date-nav input[type=date]{
    border:none; font-size:14px; font-weight:600; padding:8px 6px; background:none; color:var(--ink); min-width:0; flex:1;
  }
  .parity-pill{font-size:12px; font-weight:700; padding:5px 13px; border-radius:20px; flex-shrink:0;}
  .parity-pill.odd{background:#fde68a; color:#92400e;}
  .parity-pill.even{background:#bae6fd; color:#0369a1;}
  .timeline{position:relative; margin-top:8px;}
  .tline-item{display:flex; gap:12px; margin-bottom:2px;}
  .tline-time{width:64px; flex-shrink:0; font-size:11.5px; color:var(--sub); padding-top:11px; text-align:right;}
  .tline-bar{width:3px; border-radius:3px; flex-shrink:0;}
  .tline-content{flex:1; padding:11px 14px; border-radius:12px; margin-bottom:8px;}
  .tline-content h5{margin:0 0 2px; font-size:13.5px;}
  .tline-content p{margin:0; font-size:11.5px; color:var(--sub);}
  .topic-subject{margin-bottom:18px;}
  .topic-subject h3{display:flex; align-items:center; gap:10px; font-size:15px; margin:0 0 8px;}
  .subject-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .progress-bg{height:8px; background:#eee; border-radius:6px; overflow:hidden; margin:6px 0 12px;}
  .progress-fill{height:100%; border-radius:6px; transition:width .3s;}
  .topic-row{display:flex; align-items:center; gap:12px; padding:10px 2px; font-size:14px; min-height:30px;}
  .topic-row input{width:20px; height:20px; cursor:pointer; flex-shrink:0; accent-color:var(--accent);}
  .topic-row.done span{text-decoration:line-through; color:var(--sub);}
  .note{font-size:12px; color:var(--sub); background:#f8f9fd; border-radius:10px; padding:10px 14px; margin-top:6px;}

  /* ===== Category dropdowns (What's Coming Up) ===== */
  .cat-card{background:var(--card); border-radius:16px; box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;}
  .cat-card > summary{
    display:flex; align-items:center; gap:13px; padding:15px 18px; cursor:pointer; list-style:none;
    -webkit-user-select:none; user-select:none;
  }
  .cat-card > summary::-webkit-details-marker{display:none;}
  .cat-card > summary:active{background:#f8f9fd;}
  .cat-ic{width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;}
  .cat-name{flex:1; min-width:0;}
  .cat-name b{display:block; font-size:15.5px; line-height:1.3;}
  .cat-name span{font-size:11.5px; color:var(--sub);}
  .cat-count{font-size:12.5px; font-weight:700; padding:4px 11px; border-radius:20px; flex-shrink:0;}
  .cat-chev{color:#c3c6d4; font-size:11px; flex-shrink:0; transition:transform .18s;}
  .cat-card[open] .cat-chev{transform:rotate(90deg);}
  .cat-body{padding:0 18px 14px;}
  .exam-card.flat{border-top:1px solid var(--line); padding:14px 0; margin:0;}
  .ev-row{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-top:1px solid var(--line);}
  .ev-date{width:78px; flex-shrink:0; font-size:11.5px; font-weight:700; color:var(--sub); padding-top:3px;}
  .ev-main{flex:1; min-width:0; font-size:14px; line-height:1.45;}
  .ev-main .sub{font-size:12px; color:var(--sub); margin-top:2px;}
  .sub-head{font-size:11px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.04em; padding:14px 0 2px;}

  .seg{display:flex; flex-wrap:wrap; gap:5px; background:#f0f1fa; padding:4px; border-radius:13px; margin-bottom:16px;}
  .seg button{
    flex:1 1 92px; border:none; background:none; font:inherit; font-size:12.5px; font-weight:600;

  }
  .seg button.active{background:#fff; color:var(--accent); box-shadow:0 1px 5px rgba(30,30,60,.12);}
  .form-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:13px;}
  .field{flex:1; min-width:150px; display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:11px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.04em;}
  .field input, .field textarea{
    font:inherit; font-size:15px; padding:11px 13px; border:1px solid var(--line); border-radius:11px;
    background:#fbfbfe; color:var(--ink); width:100%; -webkit-appearance:none; appearance:none;
  }
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--accent); background:#fff;}
  .field textarea{min-height:62px; resize:vertical;}
  .btn{
    font:inherit; font-size:14.5px; font-weight:600; padding:12px 20px; border-radius:12px; border:none;
    cursor:pointer; background:var(--accent); color:#fff;
  }
  .btn:active{opacity:.85;}
  .btn.ghost{background:#f0f1fa; color:var(--ink);}
  .btn.small{font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:9px;}
  .btn.danger{background:#fee2e2; color:#991b1b;}
  .form-err{font-size:12.5px; color:#b91c1c; margin-top:2px;}
  .chip-toggle{
    font:inherit; font-size:11.5px; font-weight:600; padding:6px 11px; border-radius:20px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--sub); margin:0;
  }
  .chip-toggle.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .remind-row{padding:10px 0; border-top:1px solid var(--line);}
  .remind-name{font-size:13.5px; font-weight:600; margin-bottom:7px;}
  .code-box{
    display:flex; align-items:center; gap:10px; background:#f6f7fc; border:1px solid var(--line);
    border-radius:11px; padding:10px 12px;
  }
  .code-box code{
    flex:1; min-width:0; font-size:15px; letter-spacing:.06em; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    overflow-wrap:anywhere;
  }
  .entry{display:flex; gap:12px; align-items:flex-start; padding:13px 0; border-bottom:1px solid var(--line);}
  .entry:last-child{border-bottom:none; padding-bottom:0;}
  .entry .grow{flex:1; min-width:0;}
  .entry h4{margin:0 0 3px; font-size:14.5px; display:flex; align-items:center; gap:8px;}
  .entry .meta{font-size:12px; color:var(--sub);}
  .entry-actions{display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end;}
  .entry.gone{opacity:.42;}
  .empty{font-size:13px; color:var(--sub); padding:4px 0;}
  details.builtins summary{
    cursor:pointer; font-size:14px; font-weight:600; padding:2px 0; list-style:none;
  }
  details.builtins summary::-webkit-details-marker{display:none;}
  details.builtins summary::before{content:'▸ '; color:var(--sub);}
  details.builtins[open] summary::before{content:'▾ ';}

  /* ===== Mobile breakpoint ===== */
  @media (max-width:880px){
    nav.sidebar{display:none;}
    nav.tabbar{display:flex;}
    main{padding:calc(16px + var(--safe-top)) 14px calc(84px + var(--safe-bottom)); max-width:none;}
    .week-grid{grid-template-columns:1fr; gap:10px;}
    .day-col{min-height:auto;}
    .countdown-bar{flex-direction:column; align-items:flex-start; text-align:left;}
    .countdown-bar > div:last-child{text-align:left !important;}
    h2.section-title{font-size:18px;}
  }
</style>

<script>
const SUBJECT_COLORS = {Mathematics:'var(--math)', History:'var(--hist)', Physics:'var(--phy)', Chemistry:'var(--chem)', 'Higher Chinese':'#ec4899', 'English Language':'#14b8a6', 'Inquiry and Advocacy':'#ef4444'};

// ---- Push notifications ----
// Replace PUSH_SERVER with your deployed Cloudflare Worker URL (e.g. https://yourworker.yourname.workers.dev)
const PUSH_SERVER = 'https://personalplanner.myra-phua10.workers.dev';
// Rotated Sept 2026: the private half of the previous pair was stored as a
// Cloudflare Secret and could no longer be read back, so a new pair was
// generated. ensureSubscription() below re-subscribes any device still holding
// a subscription bound to the old key.
const VAPID_PUBLIC_KEY = 'BJkEOcKBLc7XWwbIjscx6SvGs-C8QyTgJdSHLuT0CDfTa0qK0Kaxi1nR6Rc08Ags6WGKg44ckPzeK1MlIT8xs7M';

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0;i<rawData.length;i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

// A push subscription is welded to the VAPID key it was created with. If that
// key is ever rotated, the subscription sitting in the browser still points at
// the old one and every push signed with the new key is rejected — silently,
// from the app's point of view. So compare before reusing, and start again if
// they differ.
async function ensureSubscription(reg){
  const wanted = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
  let sub = await reg.pushManager.getSubscription();
  if(sub){
    const current = new Uint8Array(sub.options && sub.options.applicationServerKey || new ArrayBuffer(0));
    const matches = current.length === wanted.length && current.every((b,i)=> b === wanted[i]);
    if(!matches){
      try{ await sub.unsubscribe(); }catch(err){ /* replaced below regardless */ }
      sub = null;
    }
  }
  if(!sub){
    sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey: wanted});
  }
  return sub;
}

async function enableNotifications(){
  const statusEl = document.getElementById('notifStatus');
  const titleEl = document.getElementById('notifTitle');
  if(PUSH_SERVER === 'PASTE_YOUR_WORKER_URL_HERE'){
    statusEl.textContent = 'Not set up yet — Cloudflare Worker URL is missing.';
    return;
  }
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    statusEl.textContent = 'Push notifications are not supported in this browser.';
    return;
  }
  const isIOSNow = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if(isIOSNow && window.navigator.standalone !== true){
    statusEl.textContent = 'On iPhone/iPad: first "Add to Home Screen" above, then open the app from that icon, then tap here again.';
    return;
  }
  try{
    const reg = await navigator.serviceWorker.register('sw.js');
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      statusEl.textContent = 'Notifications permission was not granted.';
      return;
    }
    const sub = await ensureSubscription(reg);
    await fetch(PUSH_SERVER + '/subscribe', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(sub),
    });
    titleEl.textContent = '🔔 Timetable reminders on';
    statusEl.textContent = "You'll get nudges for swim, gym, tuition and study blocks.";
  } catch(err){
    statusEl.textContent = 'Something went wrong enabling notifications: ' + err.message;
  }
}

// ---- Parity engine ----
// Term weeks alternate Odd/Even from each term's first Monday — but the cycle resets
// at the start of a new term, so a single continuous anchor breaks across term breaks.
// Confirmed from the journal: T3W1 starts 29 Jun (odd), and T4W1 starts 14 Sep (odd, after
// the Sep school holidays — Sep 16 Wed is logged as OWN DAY, which only fits if that week is odd).
const TERM_ANCHORS = [
  {monday:'2026-06-29', parity:'odd'},
  {monday:'2026-09-14', parity:'odd'},
];
const MIN_DATE = '2026-06-29', MAX_DATE = '2026-11-29';
function mondayOf(d){
  const dt = new Date(d); const day = dt.getDay();
  const diff = (day===0?-6:1-day);
  dt.setDate(dt.getDate()+diff); dt.setHours(0,0,0,0); return dt;
}
function parityOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const mon = mondayOf(d);
  let anchor = TERM_ANCHORS[0];
  for(const a of TERM_ANCHORS){ if(mondayOf(new Date(a.monday+'T00:00:00')) <= mon) anchor = a; }
  const anchorMon = mondayOf(new Date(anchor.monday+'T00:00:00'));
  const weeks = Math.round((mon - anchorMon)/(7*86400000));
  const mod = ((weeks % 2)+2)%2;
  const flipped = mod!==0;
  if(!flipped) return anchor.parity;
  return anchor.parity==='odd' ? 'even' : 'odd';
}
function fmtDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
function fmtDateShort(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'});
}
function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr+'T00:00:00');
  return Math.round((target-today)/86400000);
}
// Formats a Date in LOCAL time. toISOString() would convert to UTC first, which
// in Singapore (UTC+8) rolls the date back a day — that made the next-day button
// a no-op and opened the app on yesterday before 8am.
function toISODate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayISO(){ return toISODate(new Date()); }
function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return toISODate(d);
}

// ---- The planner document ----
// Everything Myra changes — entries she types in, school exams she's hidden,
// ticked topics — lives in one document in localStorage. Each item carries its
// own `updatedAt`, which is what lets two devices merge instead of overwriting
// each other (see mergeDoc below and functions/api/planner-sync.js).
//
// Deletes are tombstones (`deleted:true`) rather than removals, otherwise a
// delete on the phone would look like "missing" on the laptop and get resurrected
// by the merge. They're dropped after 90 days.
const DOC_KEY = 'planner-doc-v1';
const TOMBSTONE_TTL = 90 * 86400000;
// `settings` holds reminder preferences, one item per setting so two devices
// can change different settings without one losing. `snapshot` is a single
// item: a plain list of what's coming up, written for the Worker's benefit so
// the cron job can send reminders without knowing the timetable.
const SECTIONS = ['entries','hidden','topics','settings','snapshot'];

function readList(key){
  try{ const a = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(a) ? a : []; }
  catch(err){ return []; }
}
function writeList(key, list){
  try{ localStorage.setItem(key, JSON.stringify(list)); }
  catch(err){ /* storage full or blocked — the doc save below reports it */ }
}

let doc = null;

function blankDoc(){ return {entries:{}, hidden:{}, topics:{}, settings:{}, snapshot:{}}; }

function loadDoc(){
  if(doc) return doc;
  try{
    const raw = JSON.parse(localStorage.getItem(DOC_KEY) || 'null');
    doc = (raw && typeof raw === 'object') ? raw : blankDoc();
  }catch(err){ doc = blankDoc(); }
  SECTIONS.forEach(s=>{ if(!doc[s] || typeof doc[s] !== 'object') doc[s] = {}; });
  migrateLegacy();
  return doc;
}

function saveDoc({sync = true} = {}){
  try{ localStorage.setItem(DOC_KEY, JSON.stringify(doc)); }
  catch(err){ alert('Could not save — this browser is out of storage space.'); }
  if(sync) queueSync();
}

// One-time lift of the pre-sync storage format into the document.
const LEGACY_KINDS = {exam:'exams', event:'important', note:'other'};
function migrateLegacy(){
  if(doc.migrated) return;
  const now = Date.now();
  readList('planner-custom-v1').forEach(x=>{
    const id = x.id || (now.toString(36) + Math.random().toString(36).slice(2,7));
    const kind = LEGACY_KINDS[x.kind] || (CAT[x.kind] ? x.kind : 'other');
    doc.entries[id] = {...x, id, kind, updatedAt: now};
  });
  readList('planner-hidden-builtin-v1').forEach(k=>{ doc.hidden[k] = {on:true, updatedAt: now}; });
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith('topic-')) doc.topics[k] = {done: localStorage.getItem(k)==='1', updatedAt: now};
  }
  doc.migrated = true;
  saveDoc({sync:false});
}

// Same rule as the server: for each item, the newer `updatedAt` wins.
function mergeDoc(mine, theirs){
  const out = {};
  SECTIONS.forEach(s=>{
    out[s] = {...(mine[s]||{})};
    Object.entries(theirs[s]||{}).forEach(([k,v])=>{
      if(!v || typeof v !== 'object') return;
      const cur = out[s][k];
      if(!cur || (v.updatedAt||0) > (cur.updatedAt||0)) out[s][k] = v;
    });
  });
  out.migrated = true;
  return out;
}

function pruneTombstones(){
  const now = Date.now();
  Object.entries(doc.entries).forEach(([id,e])=>{
    if(e && e.deleted && now - (e.updatedAt||0) > TOMBSTONE_TTL) delete doc.entries[id];
  });
}

// ---- Reads and writes the rest of the app goes through ----
function loadCustom(){
  return Object.values(loadDoc().entries).filter(e=>e && !e.deleted);
}
function upsertEntry(entry){
  loadDoc().entries[entry.id] = {...entry, updatedAt: Date.now()};
  saveDoc();
}
function deleteEntry(id){
  const d = loadDoc();
  // A tombstone, not a removal — otherwise the other device's copy comes back.
  d.entries[id] = {id, deleted:true, updatedAt: Date.now()};
  saveDoc();
}
function loadHidden(){
  const h = loadDoc().hidden;
  return Object.keys(h).filter(k=>h[k] && h[k].on);
}
function toggleHidden(key){
  const d = loadDoc();
  const on = !(d.hidden[key] && d.hidden[key].on);
  d.hidden[key] = {on, updatedAt: Date.now()};
  saveDoc();
}
function topicDone(key){
  const t = loadDoc().topics[key];
  return Boolean(t && t.done);
}
function setTopicDone(key, done){
  loadDoc().topics[key] = {done, updatedAt: Date.now()};
  saveDoc();
}
function getSetting(key, fallback){
  const s = loadDoc().settings[key];
  return (s && s.value !== undefined && s.value !== null) ? s.value : fallback;
}
function setSetting(key, value){
  loadDoc().settings[key] = {value, updatedAt: Date.now()};
  saveDoc();
}

// ---- Calendar snapshot ----
// The reminder cron runs on the Worker, which has no idea what EXAMS or EVENTS
// contain — those only exist in this file. So the effective calendar (built-in
// exams minus hidden ones, built-in events, and hand-added entries) is written
// into the synced document for it to read. Titles are raw here, not escaped:
// they end up in a notification, not in HTML.
const SNAPSHOT_DAYS = 120;
function buildSnapshot(){
  const today = todayISO(), horizon = addDays(today, SNAPSHOT_DAYS);
  const hidden = loadHidden();
  const items = [];
  const within = d => d && d >= today && d <= horizon;

  EXAMS.forEach(e=>{
    if(hidden.includes(builtinKey(e)) || !within(e.date)) return;
    items.push({id:'exam:'+builtinKey(e), kind:'exams', title:`${e.subject} — ${e.code}`, date:e.date, time:''});
  });
  Object.entries(EVENTS).forEach(([date, list])=>{
    if(!within(date)) return;
    list.forEach((ev,i)=> items.push({id:`ev:${date}:${i}`, kind:ev.cat||'important', title:ev.text, date, time:''}));
  });
  loadCustom().forEach(x=>{
    if(!within(x.date)) return;
    const it = {id:x.id, kind:x.kind, title:x.title, date:x.date, time:x.time||''};
    if(Array.isArray(x.remind)) it.remind = x.remind;
    items.push(it);
  });

  return items.sort((a,b)=> a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
}
function refreshSnapshot(){
  const d = loadDoc();
  const items = buildSnapshot();
  const prev = d.snapshot.cal;
  if(prev && JSON.stringify(prev.value) === JSON.stringify(items)) return false;
  d.snapshot.cal = {value: items, updatedAt: Date.now()};
  return true;
}

// Built-in exams are identified by their content, not an index, so hiding one
// keeps working if the timetable above is edited later.
const builtinKey = (e)=> `${e.subject}|${e.code}|${e.date}`;

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Subjects Myra adds herself won't be in SUBJECT_COLORS, so give them a stable
// colour derived from the name rather than a random one on every render.
const EXTRA_COLORS = ['#6366f1','#0ea5e9','#f97316','#a855f7','#22c55e','#e11d48','#0d9488','#7c3aed'];
function colorFor(subject){
  if(SUBJECT_COLORS[subject]) return SUBJECT_COLORS[subject];
  let h = 0;
  for(let i=0;i<subject.length;i++) h = (h*31 + subject.charCodeAt(i)) >>> 0;
  return EXTRA_COLORS[h % EXTRA_COLORS.length];
}

function customExams(){
  return loadCustom().filter(x=>x.kind==='exams' && x.date).map(x=>({
    subject: esc(x.title) || 'Exam',
    code: esc(x.code) || 'Paper',
    date: x.date,
    estimated: false,
    weight: (x.weight===''||x.weight==null) ? null : Number(x.weight),
    weightLabel: 'added by you',
    topics: (x.topics||[]).map(esc).concat(x.detail?[esc(x.detail)]:[]),
    custom: true,
  }));
}
function allExams(){
  const hidden = loadHidden();
  return EXAMS.filter(e=>!hidden.includes(builtinKey(e))).concat(customExams());
}
function eventsFor(dateStr){
  const out = (EVENTS[dateStr]||[]).map(ev=>ev.text);
  loadCustom().filter(x=>x.kind!=='exams' && x.date===dateStr).forEach(x=>{
    const head = [(CAT[x.kind]||CAT.other).icon, x.time||'', esc(x.title)].filter(Boolean).join(' ');
    out.push(head + (x.detail?` — ${esc(x.detail)}`:''));
  });
  return out;
}

// Everything still to come in one category, built-in and hand-added together.
// Exams are excluded — they have their own richer cards.
function categoryItems(catId){
  const out = [];
  Object.entries(EVENTS).forEach(([date, list])=>{
    if(daysUntil(date) < 0) return;
    list.forEach(ev=>{ if((ev.cat||'important')===catId) out.push({date, text:ev.text}); });
  });
  loadCustom().forEach(x=>{
    if(x.kind !== catId) return;
    if(x.date && daysUntil(x.date) < 0) return;
    out.push({date:x.date||'', text:esc(x.title), time:x.time||'', detail:esc(x.detail||''), mine:true, id:x.id});
  });
  return out.sort((a,b)=>{
    if(!a.date) return 1;
    if(!b.date) return -1;
    return a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||'');
  });
}

function trainingHtml(){

  if(!rows.length) return '';
  return `<div class="sub-head">🔁 Training this week</div>${rows.join('')}

}

      ${rows}
    </div>`;
  }).join('');

  Object.keys(TOPIC_BANK).forEach(subject=>{
    const inputs = el.querySelectorAll(`input[data-key^="topic-${subject}-"]`);
    inputs.forEach(inp=>{
      const saved = topicDone(inp.dataset.key);
      inp.checked = saved;
      if(saved) document.getElementById(`row-${inp.dataset.key}`).classList.add('done');
      inp.addEventListener('change', ()=>{
        setTopicDone(inp.dataset.key, inp.checked);
        document.getElementById(`row-${inp.dataset.key}`).classList.toggle('done', inp.checked);
        updateProgress(subject);
      });
    });
    updateProgress(subject);
  });
  function updateProgress(subject){
    const inputs = document.querySelectorAll(`input[data-key^="topic-${subject}-"]`);
    const total = inputs.length;
    const done = [...inputs].filter(i=>i.checked).length;
    document.getElementById(`bar-${subject}`).style.width = (total? (done/total*100):0) + '%';
  }
}

// ---- Cross-device sync ----
// The planner is served by the same Cloudflare Worker that handles
// /api/planner-sync, so this is a same-origin call. If you ever host the page
// somewhere else, put that Worker's full URL here instead (the endpoint sends
// CORS headers, so a different origin works too).
const SYNC_BASE = '';
const SYNC_URL = SYNC_BASE.replace(/\/$/,'') + '/api/planner-sync';

// The code stays on the device and is deliberately NOT part of the synced
// document — it's the key to it.
const SYNC_CODE_KEY = 'planner-sync-code';
const CODE_ALPHABET = 'abcdefghjkmnpqrstuvwxyz23456789'; // no l/i/o/0/1 — these get typed by hand

let syncTimer = null, syncing = false, syncPane = 'idle', codeVisible = false;
let syncStatus = {state:'idle', at:null, error:null};

const syncCode = ()=> localStorage.getItem(SYNC_CODE_KEY) || '';
function setSyncCode(code){
  if(code) localStorage.setItem(SYNC_CODE_KEY, code);
  else localStorage.removeItem(SYNC_CODE_KEY);
}
function newSyncCode(){
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  return [...bytes].map(b=>CODE_ALPHABET[b % CODE_ALPHABET.length]).join('').match(/.{4}/g).join('-');
}
function normalizeCode(raw){
  const flat = String(raw||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  return flat.replace(/(.{4})(?=.)/g,'$1-');
}

function queueSync(){
  if(!syncCode()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 1200);
}

async function syncNow(){
  const code = syncCode();
  if(!code || syncing) return;
  syncing = true;
  syncStatus = {...syncStatus, state:'syncing', error:null};
  renderSyncCard();
  try{
    loadDoc();
    pruneTombstones();
    if(refreshSnapshot()) saveDoc({sync:false});
    const res = await fetch(SYNC_URL, {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({code, doc}),
    });
    if(!res.ok){
      const detail = await res.json().catch(()=>({}));
      // 404/405/501 all mean "this server doesn't have the sync route" — most
      // likely the Worker hasn't been redeployed since sync was added.
      throw new Error(detail.error || ([404,405,501].includes(res.status)
        ? 'Sync isn\'t available on the server yet — the Worker needs redeploying.'
        : `Server said ${res.status}.`));
    }
    const data = await res.json();
    const before = JSON.stringify(doc);
    doc = mergeDoc(doc, data.doc || {});
    saveDoc({sync:false});
    syncStatus = {state:'ok', at: Date.now(), error:null};
    if(JSON.stringify(doc) === before){
      renderSyncCard();
    } else {
      readFormInputs();      // don't lose half-typed input to an incoming change
      refreshEverything();
    }
  }catch(err){
    const offline = (typeof navigator !== 'undefined') && navigator.onLine === false;
    syncStatus = {state:'error', at: syncStatus.at, error: offline ? 'No internet — changes will sync when you\'re back online.' : (err.message || 'Could not reach the server.')};
    renderSyncCard();
  }finally{
    syncing = false;
  }
}

function agoText(ts){
  if(!ts) return '';
  const secs = Math.round((Date.now()-ts)/1000);
  if(secs < 60) return 'just now';
  if(secs < 3600) return `${Math.round(secs/60)} min ago`;
  return `${Math.round(secs/3600)}h ago`;
}

function syncCardHtml(){
  const code = syncCode();
  if(!code){
    if(syncPane === 'enter'){
      return `<div class="card">
        <h3 style="margin:0 0 4px; font-size:16px">🔗 Connect this device</h3>
        <div class="exam-meta">Type the sync code from your other device. Everything on both ends gets merged — nothing is thrown away.</div>
        <div class="form-row" style="margin-top:12px">
          <div class="field"><label for="codeIn">Sync code</label>
            <input id="codeIn" placeholder="abcd-efgh-ijkl-mnop" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
        </div>
        ${syncStatus.error ? `<div class="form-err">${esc(syncStatus.error)}</div>` : ''}
        <div style="display:flex; gap:10px; margin-top:6px; flex-wrap:wrap">
          <button class="btn" id="connectSync">Connect</button>
          <button class="btn ghost" id="cancelSync">Cancel</button>
        </div>
      </div>`;
    }
    return `<div class="card">
      <h3 style="margin:0 0 4px; font-size:16px">📴 Sync is off</h3>
      <div class="exam-meta">Everything is saved on this device only. Turn on sync to see the same entries, hidden exams and ticked topics on your phone and laptop.</div>
      <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap">
        <button class="btn" id="startSync">Turn on sync</button>
        <button class="btn ghost" id="haveCode">I already have a code</button>
      </div>
    </div>`;
  }

  const s = syncStatus;
  const line = s.state==='syncing' ? '<span style="color:var(--sub)">Syncing…</span>'
    : s.state==='error' ? `<span style="color:#b91c1c">${esc(s.error)}</span>`
    : s.at ? `<span style="color:#047857">✅ Synced ${agoText(s.at)}</span>`
    : '<span style="color:var(--sub)">Waiting for first sync…</span>';

  return `<div class="card">
    <h3 style="margin:0 0 4px; font-size:16px">🔄 Syncing across devices</h3>
    <div class="exam-meta" style="margin-bottom:10px">${line}</div>
    <div class="code-box">
      <code id="codeText">${codeVisible ? esc(code) : '••••-••••-••••-••••'}</code>
      <button class="btn ghost small" id="toggleCode">${codeVisible ? 'Hide' : 'Show'}</button>
    </div>
    <div class="note" style="margin-top:10px">Enter this code on your other device to link it. Anyone with the code can read and change your planner, so keep it to yourself.</div>
    <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap">
      <button class="btn ghost small" id="copyCode">Copy code</button>
      <button class="btn ghost small" id="syncNowBtn">Sync now</button>
      <button class="btn danger small" id="stopSync">Turn off sync</button>
    </div>
  </div>`;
}

function renderSyncCard(){
  const host = document.getElementById('syncCard');
  if(!host) return;
  host.innerHTML = syncCardHtml();

  const on = (id, fn)=>{ const n = document.getElementById(id); if(n) n.addEventListener('click', fn); };

  on('startSync', async ()=>{
    setSyncCode(newSyncCode());
    codeVisible = true;
    syncStatus = {state:'idle', at:null, error:null};
    renderSyncCard();
    await syncNow();
  });
  on('haveCode', ()=>{ syncPane = 'enter'; syncStatus = {...syncStatus, error:null}; renderSyncCard(); });
  on('cancelSync', ()=>{ syncPane = 'idle'; syncStatus = {...syncStatus, error:null}; renderSyncCard(); });
  on('connectSync', async ()=>{
    const code = normalizeCode(document.getElementById('codeIn').value);
    if(code.replace(/-/g,'').length < 8){
      syncStatus = {...syncStatus, error:'That code looks too short — check it against the other device.'};
      return renderSyncCard();
    }
    setSyncCode(code);
    syncPane = 'idle';
    syncStatus = {state:'idle', at:null, error:null};
    renderSyncCard();
    await syncNow();
  });
  on('toggleCode', ()=>{ codeVisible = !codeVisible; renderSyncCard(); });
  on('copyCode', async ()=>{
    try{ await navigator.clipboard.writeText(syncCode()); alert('Sync code copied.'); }
    catch(err){ codeVisible = true; renderSyncCard(); alert('Copy failed — the code is now on screen, type it across.'); }
  });
  on('syncNowBtn', syncNow);
  on('stopSync', ()=>{
    if(!confirm('Turn off sync on this device? Your entries stay here, but changes will stop reaching your other devices.')) return;
    setSyncCode('');
    syncStatus = {state:'idle', at:null, error:null};
    codeVisible = false;
    renderSyncCard();
  });
}

// ---- Reminders ----
// Scheduling happens on the Worker (functions/reminders.js) so notifications
// arrive whether or not the app is open. This side handles the subscription and
// the preferences, both of which ride along with sync.
const OFFSETS = [
  {id:'1w', label:'A week before'},
  {id:'3d', label:'3 days before'},
  {id:'1d', label:'Day before'},
  {id:'0d', label:'On the day'},
  {id:'1h', label:'An hour before', needsTime:true},
];
const DEFAULT_OFFSETS = {
  exams:['1w','1d','0d'], important:['1d','0d'], social:['1d'], sport:['0d'], other:['0d'],
};
const remindKey = catId => `remind.${catId}`;
const offsetsFor = catId => getSetting(remindKey(catId), DEFAULT_OFFSETS[catId] || ['1d']);

let pushState = {sub:null, busy:false, msg:'', ok:''};

function notificationsSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}

async function currentPushSub(){
  if(!notificationsSupported()) return null;
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    return reg ? await reg.pushManager.getSubscription() : null;
  }catch(err){ return null; }
}

async function enableReminders(){
  pushState = {...pushState, busy:true, msg:'', ok:''};
  renderReminderCard();
  try{
    if(!notificationsSupported()) throw new Error('This browser can\'t do notifications.');
    if(/iPhone|iPad|iPod/.test(navigator.userAgent) && window.navigator.standalone !== true){
      throw new Error('On iPhone, add the planner to your Home Screen first, open it from that icon, then turn reminders on.');
    }
    // Reminders are sent from wherever the planner is stored, so they need sync.
    if(!syncCode()){
      setSyncCode(newSyncCode());
      await syncNow();
    }
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if(perm !== 'granted') throw new Error('Notifications were blocked. Turn them on for this site in your browser settings.');

    const sub = await ensureSubscription(reg);
    const res = await fetch('/api/push-subscribe', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({
        code: syncCode(),
        subscription: sub.toJSON(),
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC',
      }),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || `Server said ${res.status}.`);
    pushState = {sub, busy:false, msg:'', ok: data.configured === false
      ? 'Registered — but the server still needs its notification keys before anything can send.'
      : 'Reminders are on for this device.'};
    await syncNow();
  }catch(err){
    pushState = {...pushState, busy:false, msg: err.message || 'Could not turn reminders on.'};
  }
  renderReminderCard();
}

async function disableReminders(){
  const sub = await currentPushSub();
  if(sub){
    try{
      await fetch('/api/push-subscribe', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({code: syncCode() || 'aaaaaaaa', endpoint: sub.endpoint, unsubscribe:true}),
      });
    }catch(err){ /* the local unsubscribe below is what actually stops them */ }
    try{ await sub.unsubscribe(); }catch(err){}
  }
  pushState = {sub:null, busy:false, msg:'', ok:'Reminders are off on this device.'};
  renderReminderCard();
}

async function sendTestReminder(){
  pushState = {...pushState, busy:true, msg:'', ok:''};
  renderReminderCard();
  try{
    const sub = await currentPushSub();
    if(!sub) throw new Error('Turn reminders on first.');
    const res = await fetch('/api/push-test', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({code: syncCode(), endpoint: sub.endpoint}),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || `Server said ${res.status}.`);
    pushState = {...pushState, busy:false, ok:'Sent — it should arrive in a few seconds.'};
  }catch(err){
    pushState = {...pushState, busy:false, msg: err.message || 'Could not send a test.'};
  }
  renderReminderCard();
}

function reminderCardHtml(){
  const on = Boolean(pushState.sub);
  const rows = CATEGORIES.map(c=>{
    const picked = offsetsFor(c.id);
    const chips = OFFSETS.map(o=>`<button type="button" class="chip-toggle ${picked.includes(o.id)?'on':''}"
      data-remind="${c.id}" data-off="${o.id}">${o.label}</button>`).join('');
    return `<div class="remind-row">
      <div class="remind-name">${c.icon} ${c.label}</div>
      <div class="chip-row">${chips}</div>
    </div>`;
  }).join('');

  return `<div class="card">
    <h3 style="margin:0 0 4px; font-size:16px">${on ? '🔔 Reminders are on' : '🔕 Reminders are off'}</h3>
    <div class="exam-meta">${on
      ? 'This device gets a notification before the things you pick below. Timings are shared with your other devices.'
      : 'Get a notification before exams, deadlines and anything else you add.'}</div>
    ${pushState.msg ? `<div class="form-err" style="margin-top:8px">${esc(pushState.msg)}</div>` : ''}
    ${pushState.ok ? `<div style="font-size:12.5px; color:#047857; margin-top:8px">${esc(pushState.ok)}</div>` : ''}
    <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap">
      ${on
        ? `<button class="btn ghost small" id="testPush" ${pushState.busy?'disabled':''}>Send a test</button>
           <button class="btn danger small" id="offPush">Turn off on this device</button>`
        : `<button class="btn" id="onPush" ${pushState.busy?'disabled':''}>${pushState.busy?'Working…':'Turn on reminders'}</button>`}
    </div>

    <div class="sub-head" style="padding-top:18px">When to remind me</div>
    ${rows}

    <div class="form-row" style="margin-top:14px">
      <div class="field"><label for="remTime">Day-ahead reminders arrive at</label>
        <input id="remTime" type="time" value="${esc(getSetting('remind.time','07:00'))}"></div>
      <div class="field"><label for="digTime">Daily summary at</label>
        <input id="digTime" type="time" value="${esc(getSetting('remind.digestTime','07:00'))}" ${getSetting('remind.digest',false)?'':'disabled'}></div>
    </div>
    <label class="topic-row" style="padding-top:0">
      <input type="checkbox" id="digOn" ${getSetting('remind.digest',false)?'checked':''}>
      <span>Every morning, list what's on that day</span>
    </label>
    <div class="note">"An hour before" only applies to things you've given a time to.</div>
  </div>`;
}

function renderReminderCard(){
  const host = document.getElementById('reminderCard');
  if(!host) return;
  host.innerHTML = reminderCardHtml();

  host.querySelectorAll('[data-remind]').forEach(b=>b.addEventListener('click', ()=>{
    const cat = b.dataset.remind, off = b.dataset.off;
    const cur = offsetsFor(cat);
    const next = cur.includes(off) ? cur.filter(o=>o!==off) : [...cur, off];
    setSetting(remindKey(cat), next);
    renderReminderCard();
  }));

  const time = host.querySelector('#remTime');
  if(time) time.addEventListener('change', ()=> setSetting('remind.time', time.value || '07:00'));
  const digTime = host.querySelector('#digTime');
  if(digTime) digTime.addEventListener('change', ()=> setSetting('remind.digestTime', digTime.value || '07:00'));
  const digOn = host.querySelector('#digOn');
  if(digOn) digOn.addEventListener('change', ()=>{ setSetting('remind.digest', digOn.checked); renderReminderCard(); });

  const on = (id, fn)=>{ const n = host.querySelector('#'+id); if(n) n.addEventListener('click', fn); };
  on('onPush', enableReminders);
  on('offPush', disableReminders);
  on('testPush', sendTestReminder);
}

// ---- My Entries tab ----
const PLACEHOLDERS = {
  important: "e.g. CCA meeting, project deadline, parent-teacher meeting",
  social:    "e.g. Ella's birthday dinner, movie with Qingyang",
  sport:     "e.g. Extra gym session, time trial, away meet",
  other:     "e.g. Hand in Chem practical write-up",
};
const BLANK_ENTRY = {kind:'exams', id:null, title:'', code:'', date:'', time:'', weight:'', topics:'', detail:''};
let entryForm = {...BLANK_ENTRY};
let entryError = '';
let builtinsOpen = false;  // kept across re-renders so hiding an exam doesn't collapse the list

function refreshEverything(){
  renderCountdown();
  renderExams();
  renderToday(currentDate);
  renderTopics();
  renderMine();
}

function entryFormHtml(){
  const f = entryForm;
  const seg = CATEGORIES.map(c=>
    `<button type="button" data-kind="${c.id}" class="${f.kind===c.id?'active':''}">${c.icon} ${c.label}</button>`
  ).join('');

  let fields = '';
  if(f.kind==='exams'){
    fields = `
      <div class="form-row">
        <div class="field"><label for="fTitle">Subject</label>
          <input id="fTitle" value="${esc(f.title)}" placeholder="e.g. Biology"></div>
        <div class="field"><label for="fCode">Paper / type</label>
          <input id="fCode" value="${esc(f.code)}" placeholder="e.g. EYA, CBA2, practical"></div>
      </div>
      <div class="form-row">
        <div class="field"><label for="fDate">Date</label>
          <input id="fDate" type="date" value="${esc(f.date)}"></div>
        <div class="field"><label for="fWeight">Weighting % (optional)</label>
          <input id="fWeight" type="number" min="0" max="100" value="${esc(f.weight)}" placeholder="e.g. 55"></div>
      </div>
      <div class="form-row">
        <div class="field"><label for="fTopics">Topics (optional, separate with commas)</label>
          <input id="fTopics" value="${esc(f.topics)}" placeholder="Cells, Genetics, Ecology"></div>
      </div>`;
  } else if(f.kind==='other'){
    fields = `
      <div class="form-row">
        <div class="field"><label for="fTitle">Reminder</label>
          <input id="fTitle" value="${esc(f.title)}" placeholder="${PLACEHOLDERS.other}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label for="fDate">Date (optional — leave blank to just keep it on this list)</label>
          <input id="fDate" type="date" value="${esc(f.date)}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label for="fDetail">Notes (optional)</label>
          <textarea id="fDetail" placeholder="Any details">${esc(f.detail)}</textarea></div>
      </div>`;
  } else {
    fields = `
      <div class="form-row">
        <div class="field"><label for="fTitle">What's happening</label>
          <input id="fTitle" value="${esc(f.title)}" placeholder="${PLACEHOLDERS[f.kind]}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label for="fDate">Date</label>
          <input id="fDate" type="date" value="${esc(f.date)}"></div>
        <div class="field"><label for="fTime">Time (optional)</label>
          <input id="fTime" type="time" value="${esc(f.time)}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label for="fDetail">Notes (optional)</label>
          <textarea id="fDetail" placeholder="Anything you want to remember">${esc(f.detail)}</textarea></div>
      </div>`;
  }

  // Per-entry reminder override. Left alone, the entry just follows whatever
  // its category is set to in the Reminders card.
  const custom = Array.isArray(f.remind);
  const chips = OFFSETS.map(o=>`<button type="button" class="chip-toggle ${custom && f.remind.includes(o.id)?'on':''}"
    data-entryoff="${o.id}" ${custom?'':'disabled style="opacity:.45"'}>${o.label}</button>`).join('');
  const remindBlock = `
    <div class="sub-head" style="padding-top:14px">Remind me</div>
    <label class="topic-row" style="padding:4px 2px">
      <input type="checkbox" id="fRemindCustom" ${custom?'checked':''}>
      <span>Set a reminder just for this${custom?'' : ` — otherwise it follows ${CAT[f.kind].label}'s setting`}</span>
    </label>
    <div class="chip-row" style="margin-top:6px">${chips}</div>`;

  return `<div class="card">
    <h3 style="margin:0 0 12px; font-size:16px">${f.id ? '✏️ Edit entry' : '➕ Add something'}</h3>
    <div class="seg">${seg}</div>
    ${fields}
    ${remindBlock}
    ${entryError ? `<div class="form-err">${esc(entryError)}</div>` : ''}
    <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap">
      <button class="btn" id="saveEntry">${f.id ? 'Save changes' : 'Add to planner'}</button>
      ${f.id ? '<button class="btn ghost" id="cancelEntry">Cancel</button>' : ''}
    </div>
  </div>`;
}

function entryListHtml(){
  const items = loadCustom().slice().sort((a,b)=>{
    if(!a.date) return 1;
    if(!b.date) return -1;
    return a.date.localeCompare(b.date);
  });
  if(!items.length){
    return `<div class="card"><h3 style="margin:0 0 6px; font-size:16px">Your entries</h3>
      <div class="empty">Nothing added yet. Anything you add above shows up here, and on the right day in Today's Plan.</div></div>`;
  }
  const rows = items.map(x=>{
    const m = CAT[x.kind] || CAT.other;
    const past = x.date && daysUntil(x.date) < 0;
    const when = x.date
      ? `${fmtDateShort(x.date)}${x.time?` · ${x.time}`:''}${past?' · done':` · in ${daysUntil(x.date)}d`}`
      : 'no date';
    const extra = [
      x.kind==='exams' && x.code ? esc(x.code) : '',
      x.kind==='exams' && x.weight!=='' && x.weight!=null ? `${esc(x.weight)}%` : '',
      x.detail ? esc(x.detail) : '',
      (x.topics||[]).length ? (x.topics||[]).map(esc).join(', ') : '',
    ].filter(Boolean).join(' · ');
    return `<div class="entry ${past?'gone':''}">
      <div class="grow">
        <h4>${m.icon} ${esc(x.title)}</h4>
        <div class="meta">${when}${extra?` · ${extra}`:''}</div>
      </div>
      <div class="entry-actions">
        <button class="btn ghost small" data-edit="${esc(x.id)}">Edit</button>
        <button class="btn danger small" data-del="${esc(x.id)}">Delete</button>
      </div>
    </div>`;
  }).join('');
  return `<div class="card"><h3 style="margin:0 0 4px; font-size:16px">Your entries</h3>${rows}</div>`;
}

function builtinListHtml(){
  const hidden = loadHidden();
  // Only the ones still to come — sat papers are gone from the rest of the app
  // and there's nothing useful left to do with them here either.
  const upcoming = EXAMS.filter(e=>daysUntil(e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date));
  const rows = upcoming.map(e=>{
    const k = builtinKey(e);
    const isHidden = hidden.includes(k);
    return `<div class="entry ${isHidden?'gone':''}">
      <div class="grow">
        <h4><span class="subject-dot" style="background:${colorFor(e.subject)}"></span>${e.subject} · ${e.code}</h4>
        <div class="meta">${fmtDateShort(e.date)}${isHidden?' · hidden':''}</div>
      </div>
      <div class="entry-actions">
        <button class="btn ghost small" data-toggle="${esc(k)}">${isHidden?'Show':'Hide'}</button>
      </div>
    </div>`;
  }).join('');
  return `<div class="card"><details class="builtins" ${builtinsOpen?'open':''}>
    <summary>School exams already in the app (${upcoming.length})</summary>
    <div class="note" style="margin:10px 0 4px">Hide anything that's been cancelled or has the wrong date, then add your own version above. Hiding never deletes it — you can bring it back here any time.</div>
    ${rows}
  </details></div>`;
}

function renderMine(){
  const el = document.getElementById('tab-mine');
  el.innerHTML = '<h2 class="section-title">➕ My Entries</h2>'
    + entryFormHtml()
    + entryListHtml()
    + builtinListHtml()
    + '<div id="reminderCard"></div>'
    + '<div id="syncCard"></div>';
  renderReminderCard();
  renderSyncCard();

  const det = el.querySelector('details.builtins');
  if(det) det.addEventListener('toggle', ()=>{ builtinsOpen = det.open; });

  el.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click', ()=>{
    readFormInputs();
    entryForm.kind = b.dataset.kind;
    entryError = '';
    renderMine();
  }));

  const remindCustom = el.querySelector('#fRemindCustom');
  if(remindCustom) remindCustom.addEventListener('change', ()=>{
    readFormInputs();
    entryForm.remind = remindCustom.checked
      ? (offsetsFor(entryForm.kind) || []).slice()   // start from the category's setting
      : undefined;
    renderMine();
  });
  el.querySelectorAll('[data-entryoff]').forEach(b=>b.addEventListener('click', ()=>{
    if(!Array.isArray(entryForm.remind)) return;
    readFormInputs();
    const off = b.dataset.entryoff;
    entryForm.remind = entryForm.remind.includes(off)
      ? entryForm.remind.filter(o=>o!==off)
      : [...entryForm.remind, off];
    renderMine();
  }));

  const save = el.querySelector('#saveEntry');
  if(save) save.addEventListener('click', saveEntry);
  const cancel = el.querySelector('#cancelEntry');
  if(cancel) cancel.addEventListener('click', ()=>{ entryForm = {...BLANK_ENTRY}; entryError=''; renderMine(); });

  el.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
    const x = loadCustom().find(i=>i.id===b.dataset.edit);
    if(!x) return;
    entryForm = {
      kind:x.kind, id:x.id, title:x.title||'', code:x.code||'', date:x.date||'',
      time:x.time||'', weight:(x.weight==null?'':x.weight), topics:(x.topics||[]).join(', '), detail:x.detail||'',
      remind: Array.isArray(x.remind) ? x.remind.slice() : undefined,
    };
    entryError = '';
    renderMine();
    window.scrollTo({top:0, behavior:'smooth'});
  }));

  el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    const x = loadCustom().find(i=>i.id===b.dataset.del);
    if(!x || !confirm(`Delete "${x.title}"?`)) return;
    deleteEntry(b.dataset.del);
    if(entryForm.id === b.dataset.del) entryForm = {...BLANK_ENTRY};
    refreshEverything();
  }));

  el.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click', ()=>{
    toggleHidden(b.dataset.toggle);
    refreshEverything();
  }));
}

// Pull whatever is currently typed into entryForm, so switching type or
// re-rendering doesn't throw away half-finished input.
function readFormInputs(){
  const get = id => { const n = document.getElementById(id); return n ? n.value : undefined; };
  ['title','code','date','time','weight','topics','detail'].forEach(k=>{
    const v = get('f' + k[0].toUpperCase() + k.slice(1));
    if(v !== undefined) entryForm[k] = v;
  });
}

function saveEntry(){
  readFormInputs();
  const f = entryForm;
  const title = f.title.trim();
  if(!title){ entryError = `Give this ${CAT[f.kind].noun} a name first.`; return renderMine(); }
  if(f.kind !== 'other' && !f.date){ entryError = 'Pick a date.'; return renderMine(); }

  const entry = {
    id: f.id || (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
    kind: f.kind,
    title,
    date: f.date || '',
    time: (f.kind==='exams' || f.kind==='other') ? '' : (f.time||''),
    code: f.kind==='exams' ? f.code.trim() : '',
    weight: f.kind==='exams' && f.weight!=='' ? Number(f.weight) : null,
    topics: f.kind==='exams' ? f.topics.split(',').map(t=>t.trim()).filter(Boolean) : [],
    detail: f.kind==='exams' ? '' : f.detail.trim(),
  };
  if(Array.isArray(f.remind)) entry.remind = f.remind;

  upsertEntry(entry);

  entryForm = {...BLANK_ENTRY, kind:f.kind};
  entryError = '';
  refreshEverything();
}

// ---- Nav (both sidebar + tabbar share the same data-tab buttons) ----
function switchTab(tabName){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tabName));
  document.querySelectorAll('main section').forEach(s=>s.style.display='none');
  document.getElementById('tab-'+tabName).style.display='block';
  window.scrollTo({top:0, behavior:'instant'});
}
document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
});

loadDoc();

window.addEventListener('online', syncNow);
